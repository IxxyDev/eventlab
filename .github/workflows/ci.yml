name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 27

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - run: make test

  sql:
    name: SQL check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: eventlab
          POSTGRES_PASSWORD: eventlab
          POSTGRES_DB: eventlab
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U eventlab -d eventlab"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: eventlab
      PGLS_VERSION: 0.28.2
      PGLS_SHA256: 82ff82e39be65824378afa5d02626a1b42e8d8e48f97cb4938e4d477c8a9be52
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 27

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - run: make migrate

      - run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL -o "$bin/postgres-language-server" \
            "https://github.com/supabase-community/postgres-language-server/releases/download/$PGLS_VERSION/postgres-language-server_x86_64-unknown-linux-gnu"
          echo "$PGLS_SHA256  $bin/postgres-language-server" | sha256sum -c -
          chmod +x "$bin/postgres-language-server"
          echo "$bin" >> "$GITHUB_PATH"

      - run: make sql

  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: eventlab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: eventlab/package.json
          cache: npm
          cache-dependency-path: eventlab/package-lock.json

      - run: npm ci

      - run: npm run check

      - run: npm run lint

      - run: npm test
