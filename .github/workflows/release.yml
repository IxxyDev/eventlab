name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: Version matches tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - run: make check-version VERSION="${GITHUB_REF_NAME#v}"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: GitHub release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
