services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: eventlab
      POSTGRES_USER: eventlab
      POSTGRES_PASSWORD: eventlab
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventlab -d eventlab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
